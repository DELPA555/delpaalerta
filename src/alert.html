<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; cursor: pointer; }
      body {
        display: flex; align-items: center; gap: 12px; padding: 14px 16px;
        font-family: "Segoe UI", system-ui, sans-serif; color: #fff;
        background: linear-gradient(135deg, #b3202f, #7a1220);
        border: 2px solid #ff5a5a; box-sizing: border-box; user-select: none;
        animation: pulse 1s ease-in-out infinite alternate;
      }
      @keyframes pulse { from { border-color: #ff5a5a; } to { border-color: #ffd0d0; } }
      .ico { font-size: 30px; line-height: 1; }
      .txt { min-width: 0; }
      .t1 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; opacity: .85; }
      .t2 { font-size: 15px; font-weight: 700; margin-top: 2px; word-break: break-word; }
      .t3 { font-size: 10px; opacity: .7; margin-top: 4px; }
    </style>
  </head>
  <body title="Click para cerrar">
    <div class="ico">🔔</div>
    <div class="txt">
      <div class="t1">Delpa Alertas</div>
      <div class="t2" id="msg">Mensaje nuevo</div>
      <div class="t3">Sonido silenciado — click para cerrar</div>
    </div>
    <script>
      const { ipcRenderer } = require('electron')
      ipcRenderer.on('msg', (_e, m) => { document.getElementById('msg').textContent = m || 'Mensaje nuevo' })
      document.body.addEventListener('click', () => ipcRenderer.send('visual:close'))
    </script>
  </body>
</html>
