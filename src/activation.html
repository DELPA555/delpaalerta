<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Delpa Alertas — Licencia</title>
    <style>
      :root {
        --bg: #0b0f14; --card: #121821; --border: #24303d;
        --ink: #e7eef5; --ink2: #9fb0c0; --ink3: #64748b; --accent: #79e4aa;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; }
      .wrap { padding: 22px 22px 26px; }
      .brand { display: flex; align-items: center; gap: 10px; }
      .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px rgba(121,228,170,.7); }
      h1 { font-size: 18px; margin: 0; }
      .sub { color: var(--ink3); font-size: 13px; margin: 4px 0 18px; }
      label { display: block; color: var(--ink2); font-size: 12px; margin: 0 0 6px; }
      textarea {
        width: 100%; min-height: 90px; resize: vertical; background: #0c1219;
        border: 1px solid var(--border); color: var(--ink); border-radius: 8px;
        padding: 9px 11px; font-family: Consolas, monospace; font-size: 12px; outline: none; word-break: break-all;
      }
      textarea:focus { border-color: var(--accent); }
      button {
        margin-top: 12px; width: 100%; background: var(--accent); color: #04110c; border: none;
        border-radius: 8px; padding: 11px; font-size: 14px; font-weight: 600; cursor: pointer;
      }
      button:disabled { opacity: .5; cursor: default; }
      .status { min-height: 18px; margin-top: 12px; font-size: 13px; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-top: 18px; }
      .row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
      .row .k { color: var(--ink3); }
      .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; }
      .pill.ok { background: rgba(121,228,170,.15); color: var(--accent); }
      .pill.warn { background: rgba(245,197,66,.15); color: #f5c542; }
      .pill.bad { background: rgba(239,90,90,.15); color: #ef5a5a; }
      .mono { font-family: Consolas, monospace; }
      .hint { color: var(--ink3); font-size: 11px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand"><span class="dot"></span><h1>Delpa Alertas</h1></div>
      <div class="sub">Activá tu licencia para empezar a vigilar la pantalla.</div>

      <label>Código de licencia</label>
      <textarea id="code" placeholder="Pegá acá el código que te enviaron…" spellcheck="false"></textarea>
      <button id="btnActivate">Activar</button>
      <div class="status" id="status"></div>

      <div class="card" id="estadoCard">
        <div class="row"><span class="k">Estado</span><span id="estadoPill" class="pill">—</span></div>
        <div class="row"><span class="k">Cliente</span><span id="cliente">—</span></div>
        <div class="row"><span class="k">Vence</span><span id="vence" class="mono">—</span></div>
        <div class="row"><span class="k">ID de esta PC</span><span id="pcid" class="mono">—</span></div>
      </div>
      <div class="hint">
        El "ID de esta PC" sirve para soporte. La licencia queda atada a esta computadora.
      </div>
    </div>

    <script>
      const { ipcRenderer } = require('electron')
      const $ = (id) => document.getElementById(id)

      function fmtFecha(iso) {
        if (!iso) return '—'
        const [y, m, d] = iso.split('-')
        return `${d}/${m}/${y}`
      }
      function pill(estado) {
        const p = $('estadoPill')
        const map = {
          activa: ['ok', 'Activa'],
          gracia: ['warn', 'En período de gracia'],
          vencida: ['bad', 'Vencida'],
          otra_pc: ['bad', 'Activada en otra PC'],
          invalida: ['bad', 'Inválida'],
          sin_activar: ['warn', 'Sin activar']
        }
        const [cls, txt] = map[estado] || ['warn', estado || '—']
        p.className = 'pill ' + cls
        p.textContent = txt
      }
      function render(st) {
        pill(st.estado)
        $('cliente').textContent = st.cliente || '—'
        $('vence').textContent = fmtFecha(st.expira)
        $('pcid').textContent = st.machineShort || '—'
      }

      async function load() {
        const st = await ipcRenderer.invoke('license:status')
        render(st)
      }

      $('btnActivate').onclick = async () => {
        const code = $('code').value.trim()
        if (!code) return say('Pegá el código de licencia.', false)
        $('btnActivate').disabled = true
        const res = await ipcRenderer.invoke('license:activate', code)
        $('btnActivate').disabled = false
        if (!res.ok) return say(res.mensaje || 'No se pudo activar.', false)
        render(res)
        say('¡Licencia activada! ' + (res.mensaje || ''), true)
        $('code').value = ''
      }

      function say(msg, ok) {
        const s = $('status')
        s.textContent = msg
        s.style.color = ok ? 'var(--accent)' : '#ef5a5a'
      }

      load()
    </script>
  </body>
</html>
